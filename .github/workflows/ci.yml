name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prisma generate` runs on postinstall and needs no database.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

  database:
    name: Fresh database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazari_ci
        ports: ["5432:5432"]
        # Without this the job races the container and the first query fails.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bazari_ci
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      # The seed refuses to run without a password for each of the three
      # accounts, which is the point of it — a default that ships in the repo
      # is a default on every deployment that forgets. These are literals
      # rather than secrets because the database they seed is a throwaway
      # container that is destroyed with the job; they are not credentials to
      # anything.
      ADMIN_EMAIL: admin@bazari.ge
      ADMIN_PASSWORD: ci-only-admin-password
      VIEWER_EMAIL: viewer@bazari.ge
      VIEWER_PASSWORD: ci-only-viewer-password
      CUSTOMER_EMAIL: user@bazari.ge
      CUSTOMER_PASSWORD: ci-only-customer
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the real migrations against a database that was empty a minute
      # ago — which is exactly the state a new host starts in — so a migration
      # that only works on an already-populated schema fails here, before it
      # is run against the shop's own database.
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      # The same checks used when moving to a new Postgres: that the schema is
      # what the app expects, and that what the seed wrote is internally
      # consistent — order totals that match their items, whole-tetri prices,
      # Georgian that survived the round trip.
      - run: npm run db:verify
      - run: npm run db:audit
