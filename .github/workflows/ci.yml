name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · types · unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prisma generate` runs on postinstall and needs no database.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazari_test
        ports: ["5432:5432"]
        # Without this the job races the container and the first query fails.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bazari_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      # The seed refuses to run without a password for each of the three
      # accounts, which is the point of it — a default that ships in the repo
      # is a default on every deployment that forgets. These are literals
      # rather than secrets because the database they seed is a throwaway
      # container that is destroyed with the job; they are not credentials to
      # anything, and pinning them here keeps the workflow readable and the
      # e2e helpers able to sign in.
      ADMIN_EMAIL: admin@bazari.ge
      ADMIN_PASSWORD: ci-only-admin-password
      VIEWER_EMAIL: viewer@bazari.ge
      VIEWER_PASSWORD: ci-only-viewer-password
      CUSTOMER_EMAIL: user@bazari.ge
      CUSTOMER_PASSWORD: ci-only-customer
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      # No RESEND_API_KEY on purpose: mail must degrade, not break the suite.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the real migrations against a throwaway database, so a migration
      # that only works on an already-populated schema fails here.
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      # The same check used when moving to a new Postgres. Running it here
      # means the migration rehearsal and the tool that validates it are both
      # exercised on every push, against a container that was empty a minute
      # ago — which is exactly the state a new host starts in.
      - run: npm run db:verify

      # And that what the seed wrote is internally consistent — order totals
      # that match their items, whole-tetri prices, Georgian that survived the
      # round trip. The seed is the template a real catalogue replaces, so an
      # invariant it quietly breaks would be inherited by every shop built on
      # it.
      - run: npm run db:audit

      # WebKit as well as Chromium. It is the only engine iOS renders with, and
      # the first run of it found a CSP directive that broke every subresource
      # on the site — invisible in Chromium, which exempts localhost from it.
      # It runs a subset (the specs tagged `@engine`), so the extra minutes are
      # spent only on what differs between engines.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
